<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#3B6EF5" />
    <meta name="description" content="Offline-приложение для учёта домашнего бюджета" />
    <link rel="manifest" href="/manifest.json" />
    <title>%WEB_TITLE%</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async function () {
          try {
            const response = await fetch('/sw.js', { cache: 'no-store' });
            const contentType = response.headers.get('content-type') || '';
            const isJavaScript = /(?:java|ecma)script/i.test(contentType);

            if (response.ok && isJavaScript) {
              await navigator.serviceWorker.register('/sw.js');
              return;
            }

            // Metro returns index.html for /sw.js in development. Remove a
            // previously installed production worker instead of registering it.
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));

            if (navigator.serviceWorker.controller && !sessionStorage.getItem('service-worker-reset')) {
              sessionStorage.setItem('service-worker-reset', 'true');
              window.location.reload();
            }
          } catch {
            // Offline startup can continue with an already installed worker.
          }
        });
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
